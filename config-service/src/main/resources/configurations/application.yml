eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost} #This is only for local, in docker env eureka.instance.prefer-ip-address=true probably
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

