<div
  class="relative w-full aspect-square cursor-pointer overflow-hidden group"
  (click)="onOpenPostDetails()"
>
  <img
    [src]="post.image"
    [alt]="post.title"
    class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
  />
  <div
    class="absolute inset-0 bg-black/60 lg:bg-black/70 flex items-center justify-center p-4 transition-opacity duration-300 md:opacity-0 md:group-hover:opacity-100"
  >
    <h3
      class="text-white text-center text-xs font-light lg:text-sm leading-tight"
    >
      {{ post.title }}
    </h3>
  </div>
</div>
