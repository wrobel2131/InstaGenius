<div class="relative dropdown-container">
  <div
    class="border border-gray-200 rounded-xl bg-gray-50 hover:bg-white hover:shadow-sm focus-within:bg-white focus-within:shadow-md focus-within:border-purple-300 transition-all duration-200 cursor-pointer"
    (click)="toggleDropdown()"
  >
    <div class="flex items-center justify-between px-4 py-3">
      <label class="text-sm font-medium text-gray-700">{{
        option.label
      }}</label>
      <div class="flex items-center space-x-3">
        <span class="text-sm text-gray-900">
          {{ getSelectedValue() | titlecase }}
        </span>
        <i-lucide
          [img]="chevronDown"
          [size]="16"
          class="text-gray-500 transition-transform duration-200"
          [class.rotate-180]="isOpen"
        ></i-lucide>
      </div>
    </div>
  </div>

  @if (isOpen) {
  <div
    class="absolute top-full left-0 right-0 z-50 mt-2 border border-gray-100 shadow-xl rounded-xl bg-white animate-in fade-in-0 zoom-in-95 duration-200"
  >
    <div class="max-h-60 overflow-y-auto">
      @for (value of option.values; track value) {
      <div
        class="px-4 py-3 cursor-pointer transition-all duration-150 hover:bg-gray-50"
        [class.bg-purple-50]="isSelected(value)"
        [class.text-purple-700]="isSelected(value)"
        [class.text-gray-700]="!isSelected(value)"
        (click)="selectValue(value)"
      >
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">{{ value | titlecase }}</span>
          @if (isSelected(value)) {
          <i-lucide
            [img]="check"
            [size]="16"
            class="text-purple-700"
          ></i-lucide>
          }
        </div>
      </div>
      }
    </div>
  </div>
  }
</div>
