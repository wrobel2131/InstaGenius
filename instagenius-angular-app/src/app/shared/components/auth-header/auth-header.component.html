<nav
  class="fixed left-0 top-0 w-full backdrop-blur-md bg-white/80 z-10 shadow-sm"
>
  <div class="max-w-7xl mx-auto px-4 flex justify-between sm:px-6 lg:px-8 h-16">
    <div class="flex gap-8">
      <div routerLink="/" class="flex items-center cursor-pointer">
        <app-logo [small]="true"></app-logo>
        <span class="text-xl md:text-2xl font-bold text-gray-900"
          >InstaGenius</span
        >
      </div>
      <ul class="hidden md:flex items-center">
        <li
          [routerLink]="['generator']"
          routerLinkActive="border-b border-b-purple-700"
          #generatorActive="routerLinkActive"
          class="group h-full flex items-center justify-center min-w-20 hover:border-b hover:border-b-purple-700 cursor-pointer"
        >
          <a
            [ngClass]="{ 'text-purple-700': generatorActive.isActive }"
            class="text-gray-600 text-sm font-medium transition group-hover:text-purple-700"
            >Generator</a
          >
        </li>
        <li
          [routerLink]="['gallery']"
          routerLinkActive="border-b border-b-purple-700"
          #galleryActive="routerLinkActive"
          class="group h-full flex items-center justify-center min-w-20 hover:border-b hover:border-b-purple-700 cursor-pointer"
        >
          <a
            [ngClass]="{ 'text-purple-700': galleryActive.isActive }"
            class="text-gray-600 text-sm font-medium transition group-hover:text-purple-700"
            >Galeria</a
          >
        </li>
        <li
          [routerLink]="['profile']"
          routerLinkActive="border-b border-b-purple-700"
          #profileActive="routerLinkActive"
          class="group h-full flex items-center justify-center min-w-20 hover:border-b hover:border-b-purple-700 cursor-pointer"
        >
          <a
            [ngClass]="{ 'text-purple-700': profileActive.isActive }"
            class="text-gray-600 text-sm font-medium transition group-hover:text-purple-700"
            >Profil</a
          >
        </li>
      </ul>
    </div>
    <div class="flex gap-4 md:gap-8 items-center">
      <div
        class="flex items-center gap-1 py-1.5 px-2 rounded-3xl bg-purple-200 hover:bg-purple-300 text-purple-700 transition cursor-pointer"
      >
        <i-lucide [img]="coins" [size]="20"></i-lucide>
        <span class="text-sm">{{ credits }}</span>
      </div>
      <div class="group relative inline-block cursor-pointer">
        <i-lucide
          class="text-gray-700 group-hover:text-gray-800 transition"
          [img]="notifications"
          [size]="24"
        ></i-lucide>
        <div
          *ngIf="notificationCount > 0"
          class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center min-w-5 h-5 px-1 transform transition-all"
          [ngClass]="{ 'scale-110': notificationCount > 9 }"
        >
          {{ notificationCount > 99 ? "99+" : notificationCount }}
        </div>
      </div>
      <div class="group flex items-center cursor-pointer">
        <div
          class="flex justify-center items-center rounded-full w-8 h-8 overflow-hidden"
        >
          <img
            src="assets/Profile_avatar_placeholder_large.png"
            alt="Profile picture menu"
          />
        </div>
        <i-lucide
          class="text-gray-700 group-hover:text-gray-800 transition"
          [img]="chevronDown"
          [size]="20"
        ></i-lucide>
      </div>
    </div>
  </div>
</nav>
