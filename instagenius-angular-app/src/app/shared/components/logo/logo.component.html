<div
  class="inline-block relative transition-transform duration-300"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 90 90"
    [ngClass]="{ 'w-15 h-15': small, 'w-40 h-40': !small }"
    class="mx-auto cursor-pointer"
  >
    <!-- Infinity-like path with path drawing animation on hover -->
    <path
      d="M30,50 C30,35 45,35 50,45 C55,35 70,35 70,50 C70,65 55,65 50,55 C45,65 30,65 30,50 Z"
      stroke="#8b5cf6"
      [attr.stroke-width]="3"
      fill="none"
      stroke-dasharray="200"
      [attr.stroke-dashoffset]="isHovered ? '0' : '200'"
      class="transition-all duration-1500 ease-in-out"
    />
    <!-- Light bulb element with opacity animation -->
    <path
      d="M50,20 L50,30 M40,25 L45,32 M60,25 L55,32"
      stroke="#a855f7"
      stroke-width="2.5"
      stroke-linecap="round"
      [ngClass]="{
        'animate-glow': isHovered,
        'opacity-90': !isHovered,
        'opacity-100': isHovered
      }"
      class="transition-opacity duration-1500"
    />
    <!-- Center circle with bounce animation -->
    <circle
      cx="50"
      cy="50"
      r="8"
      stroke="#d8b4fe"
      stroke-width="2.5"
      fill="none"
      [ngClass]="{ 'animate-pulse': isHovered }"
      class="transform origin-center transition-transform duration-1500"
    />
    <!-- Brain wave element with flow animation -->
    <path
      d="M25,65 C33,75 40,60 50,70 C60,60 67,75 75,65"
      stroke="#c084fc"
      stroke-width="2.5"
      fill="none"
      stroke-linecap="round"
      [ngClass]="{
        'animate-wave': isHovered,
        'opacity-90 translate-y-1': !isHovered,
        'opacity-100': isHovered
      }"
      class="transition-all duration-1500"
    />
  </svg>
</div>
