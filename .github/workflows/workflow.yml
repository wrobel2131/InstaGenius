# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for SonarCloud to analyze entire history

      # Set up JDK for Spring Boot services
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Set up Node.js for Angular frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: angular-frontend/package-lock.json

      # Fix permissions for Maven wrapper
      - name: Make Maven wrapper executable
        run: |
          # Add execution permission to all mvnw files
          find . -name "mvnw" -type f -exec chmod +x {} \;

      # Build Spring Boot services
      - name: Build Spring Boot services
        run: |
          # Build each service separately with proper error handling
          for SERVICE in coin-management-service config-service discovery-service gateway keycloak-event-listener order-service payment-service post-generation-service post-management-service product-management-service user-service
          do
            if [ -d "$SERVICE" ] && [ -f "$SERVICE/mvnw" ]; then
              echo "Building $SERVICE..."
              cd $SERVICE
              ./mvnw clean package -DskipTests -B
              BUILD_RESULT=$?
              cd ..
          
              if [ $BUILD_RESULT -ne 0 ]; then
                echo "::error::Build failed for $SERVICE"
                exit $BUILD_RESULT
              fi
            else
              echo "Skipping $SERVICE (directory or mvnw not found)"
            fi
          done

      # Build Angular frontend
      - name: Build Angular frontend
        if: ${{ success() }} # Only run if Spring services build successfully
        run: |
          if [ -d "angular-frontend" ]; then
            cd angular-frontend
            npm ci
          
            # Check if package.json has a lint script before running it
            if grep -q "\"lint\":" package.json; then
              echo "Running lint..."
              npm run lint
            else
              echo "No lint script found in package.json, skipping"
            fi
          
            # Skip tests completely - don't try to run Karma tests
            echo "Skipping tests in CI environment as they require a browser"
          
            # Check if package.json has a build script before running it
            if grep -q "\"build\":" package.json; then
              echo "Building Angular app..."
              npm run build
            else
              echo "No build script found in package.json, skipping"
            fi
          else
            echo "Skipping Angular frontend (directory not found)"
          fi

      # Find and list class directories for SonarCloud
      - name: Find Java class directories
        id: find-classes
        run: |
          echo "Looking for compiled Java classes..."
          CLASS_DIRS=$(find . -type d -name "classes" | grep -v "node_modules" | tr '\n' ',' | sed 's/,$//')
          if [ -z "$CLASS_DIRS" ]; then
            echo "No class directories found, using default pattern"
            CLASS_DIRS="*/target/classes"
          fi
          echo "Class directories found: $CLASS_DIRS"
          echo "java_binaries=$CLASS_DIRS" >> $GITHUB_OUTPUT
          
          # Create a dummy JAR file if no libraries are found
          echo "Checking for JAR libraries..."
          JAR_COUNT=$(find . -name "*.jar" | wc -l)
          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No JAR files found, creating a dummy JAR"
            mkdir -p ./dummy-lib
            touch ./dummy-lib/dummy.jar
            echo "java_libraries=./dummy-lib/*.jar" >> $GITHUB_OUTPUT
          else
            JAR_DIRS=$(find . -name "*.jar" -not -path "*/node_modules/*" | xargs dirname | sort | uniq | tr '\n' ',' | sed 's/,$//')
            echo "JAR directories found: $JAR_DIRS"
            echo "java_libraries=$JAR_DIRS/*.jar" >> $GITHUB_OUTPUT
          fi

      # Run SonarCloud analysis for entire repository
      - name: SonarCloud Scan
        if: ${{ success() || failure() }} # Run even if build fails
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=wrobel2131_InstaGenius
            -Dsonar.organization=wrobel2131
            -Dsonar.sources=.
            -Dsonar.java.binaries=${{ steps.find-classes.outputs.java_binaries }}
            -Dsonar.java.libraries=${{ steps.find-classes.outputs.java_libraries }}
            -Dsonar.exclusions=**/node_modules/**,**/.github/**,**/target/**,**/.mvn/**,**/dist/**,**/generated/**,**/*.md,**/.git/**,**/keycloak-custom-themes/**
            -Dsonar.test.exclusions=**/node_modules/**,**/dist/**,**/*.md,**/.git/**
            -Dsonar.sourceEncoding=UTF-8

  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from branch name
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH_NAME#release/v}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check versions in pom.xml files
        run: |
          echo "Checking if all pom.xml files have version ${{ env.RELEASE_VERSION }}"
          ERRORS=0
          
          for POM_FILE in $(find . -name "pom.xml" -not -path "*/target/*"); do
            if [ -f "$POM_FILE" ]; then
              VERSION=$(grep -oP '(?<=<version>).*?(?=</version>)' $POM_FILE | head -1)
              if [ "$VERSION" != "${{ env.RELEASE_VERSION }}" ]; then
                echo "❌ $POM_FILE has version $VERSION, expected ${{ env.RELEASE_VERSION }}"
                ERRORS=$((ERRORS+1))
              else
                echo "✅ $POM_FILE has correct version $VERSION"
              fi
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            echo "::error::Found $ERRORS version mismatches. Please update all pom.xml files to version ${{ env.RELEASE_VERSION }}"
            exit 1
          fi