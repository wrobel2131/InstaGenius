# Project identification
sonar.projectKey=wrobel2131_InstaGenius
sonar.organization=wrobel2131
sonar.projectName=Instagenius

# Source code location - include all services
sonar.sources=.

# Compiled code locations
sonar.java.binaries=*/target/classes
sonar.java.test.binaries=*/target/test-classes
sonar.java.libraries=*/target/dependency/*.jar

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=*/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=angular-frontend/coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=21

# Exclusions - patterns to ignore
sonar.exclusions=\
  **/node_modules/**/*,\
  **/.github/**/*,\
  **/target/**/*,\
  **/.mvn/**/*,\
  **/dist/**/*,\
  **/generated/**/*,\
  **/.idea/**/*,\
  **/*.md,\
  **/.git/**/*,\
  **/keycloak-custom-themes/**/*

# Test file patterns
sonar.test.inclusions=**/src/test/**/*,**/*.spec.ts
sonar.test.exclusions=**/node_modules/**/*,**/dist/**/*

# TypeScript config for Angular frontend
sonar.typescript.tsconfigPath=angular-frontend/tsconfig.json
sonar.javascript.node.reportPath=angular-frontend/coverage/lcov-report