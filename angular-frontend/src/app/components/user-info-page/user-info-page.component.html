<form class="info" [formGroup]="userDataForm">
  <div class="control">
    <label
      class="control--label"
      for="username"
      [ngClass]="!isLoginEditEnabled ? 'label--disabled' : ''"
      >{{
        "profileSettingsPage.userDataSection.userInfoPage.form.usernameLabel"
          | transloco
      }}</label
    >
    <input
      class="control--input"
      type="text"
      name="username"
      id="username"
      formControlName="username"
      [ngClass]="!isLoginEditEnabled ? 'input--disabled' : ''"
    />
  </div>

  <div class="control">
    <label class="control--label" for="email">{{
      "profileSettingsPage.userDataSection.userInfoPage.form.emailLabel"
        | transloco
    }}</label>
    <input
      class="control--input"
      type="text"
      name="email"
      id="email"
      formControlName="email"
    />
  </div>
  <div class="control">
    <label class="control--label" for="firstName">{{
      "profileSettingsPage.userDataSection.userInfoPage.form.firstNameLabel"
        | transloco
    }}</label>
    <input
      class="control--input"
      type="text"
      name="firstName"
      id="firstName"
      formControlName="firstName"
    />
  </div>
  <div class="control">
    <label class="control--label" for="lastName">{{
      "profileSettingsPage.userDataSection.userInfoPage.form.lastNameLabel"
        | transloco
    }}</label>
    <input
      class="control--input"
      type="text"
      name="lastName"
      id="lastName"
      formControlName="lastName"
    />
  </div>

  <button class="upgrade" (click)="onUpgrade()">
    {{ "profileSettingsPage.userDataSection.userInfoPage.upgrade" | transloco }}
  </button>
    @if (updatingUser) {
        <span>Updating user</span>
    }
</form>
